spring.application.name=Rent
spring.datasource.url=jdbc:mysql://localhost:3306/rms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================
# App Configuration
# ============================================
app.penalty-rate=20
app.payment-window-end=10
app.upload.dir=uploads


# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──
jwt.secret=pccOjQw4iyrH8XoNSxnTBbPylbQxfPzIpaLZe7UbTn1
jwt.expiration=86400000

# ── Logging ──
logging.level.com.rms=DEBUG

# ── File Upload ──
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=uploads/


# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:517
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# Allow OPTIONS requests
spring.web.cors.allowed-origin-patterns=*