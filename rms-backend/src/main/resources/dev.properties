# ============================================================
# DEVELOPMENT PROFILE
# ============================================================
# Activate with: -Dspring.profiles.active=dev

spring.datasource.url=jdbc:mysql://localhost:3306/rms_db_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.rms=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

app.upload.dir=uploads-dev

# SMS Configuration - Mock mode for development
app.sms.mode=mock
afromessage.api-key=test-key
afromessage.sender-id=RMS
afromessage.api-url=https://api.afromessage.com/api/send