# ============================================================
# PRODUCTION PROFILE
# ============================================================
# Activate with: -Dspring.profiles.active=prod
# Or set environment variable: SPRING_PROFILES_ACTIVE=prod

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.com.rms=INFO
logging.level.org.springframework.web=WARN

app.upload.dir=${UPLOAD_DIR:/app/uploads}

# Production JWT Secret (must be set via environment variable)
jwt.secret=${JWT_SECRET}



# Production URLs
app.cors.allowed-origins=${CORS_ORIGINS:https://yourdomain.com}

# SMS Configuration - Can be set to 'real' or 'mock'
app.sms.mode=${SMS_MODE:mock}
afromessage.api-key=${AFROMESSAGE_API_KEY}
afromessage.sender-id=${AFROMESSAGE_SENDER_ID:RMS}
afromessage.api-url=${AFROMESSAGE_API_URL:https://api.afromessage.com/api/send}