# ============================================================
# PRODUCTION PROFILE
# ============================================================
# Activate with: -Dspring.profiles.active=prod
# Or set environment variable: SPRING_PROFILES_ACTIVE=prod

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.com.rms=INFO
logging.level.org.springframework.web=WARN

app.upload.dir=${UPLOAD_DIR:/app/uploads}

# Production JWT Secret (must be set via environment variable)
jwt.secret=${JWT_SECRET}

# Production URLs
app.cors.allowed-origins=${CORS_ORIGINS:https://yourdomain.com}