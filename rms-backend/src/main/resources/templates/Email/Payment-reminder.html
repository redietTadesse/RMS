<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Reminder</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
<div style="background: #f59e0b; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0;">
    <h1 style="margin: 0;">🔔 Payment Reminder</h1>
</div>
<div style="border: 1px solid #e5e7eb; padding: 20px; border-radius: 0 0 8px 8px;">
    <p>Dear <strong th:text="${tenantName}">Tenant</strong>,</p>
    <p>This is a friendly reminder that your invoice is due in <strong th:text="${daysLeft}">3</strong> days.</p>
    <div style="background: #fef3c7; padding: 15px; border-radius: 8px; margin: 15px 0;">
        <p><strong>Invoice:</strong> <span th:text="${invoiceNumber}">INV-2024-0001</span></p>
        <p><strong>Amount:</strong> ETB <span th:text="${#numbers.formatDecimal(amount, 0, 'COMMA', 2, 'POINT')}">15,000</span></p>
        <p><strong>Due Date:</strong> <span th:text="${dueDate}">January 10, 2024</span></p>
    </div>
    <a href="#" th:href="${invoiceUrl}" style="display: inline-block; padding: 12px 24px; background: #f59e0b; color: white; text-decoration: none; border-radius: 6px;">
        Pay Now
    </a>
    <p style="margin-top: 20px; font-size: 14px; color: #6b7280;">
        ⚠️ Late payments will incur a 20% penalty.
    </p>
</div>
</body>
</html>
