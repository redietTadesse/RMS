<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Confirmed</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
<div style="background: #22c55e; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0;">
    <h1 style="margin: 0;">✅ Payment Confirmed</h1>
</div>
<div style="border: 1px solid #e5e7eb; padding: 20px; border-radius: 0 0 8px 8px;">
    <p>Dear <strong th:text="${tenantName}">Tenant</strong>,</p>
    <p>Your payment has been confirmed successfully!</p>
    <div style="background: #f0fdf4; padding: 15px; border-radius: 8px; margin: 15px 0;">
        <p><strong>Invoice:</strong> <span th:text="${invoiceNumber}">INV-2024-0001</span></p>
        <p><strong>Amount Paid:</strong> ETB <span th:text="${#numbers.formatDecimal(amount, 0, 'COMMA', 2, 'POINT')}">15,000</span></p>
        <p><strong>Payment Date:</strong> <span th:text="${paymentDate}">January 5, 2024</span></p>
        <p><strong>Payment Method:</strong> <span th:text="${paymentMethod}">Bank Transfer</span></p>
    </div>
    <p style="margin-top: 20px; font-size: 14px; color: #6b7280;">
        Thank you for your payment!
    </p>
</div>
</body>
</html>
