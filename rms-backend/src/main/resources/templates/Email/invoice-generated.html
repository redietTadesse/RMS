<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generated</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
<div style="background: #4f46e5; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0;">
    <h1 style="margin: 0;">📄 New Invoice Generated</h1>
</div>
<div style="border: 1px solid #e5e7eb; padding: 20px; border-radius: 0 0 8px 8px;">
    <p>Dear <strong th:text="${tenantName}">Tenant</strong>,</p>
    <p>A new invoice has been generated for your rental space.</p>
    <div style="background: #f8fafc; padding: 15px; border-radius: 8px; margin: 15px 0;">
        <p><strong>Invoice:</strong> <span th:text="${invoiceNumber}">INV-2024-0001</span></p>
        <p><strong>Space:</strong> <span th:text="${unitNumber} + ' (' + ${spaceCategory} + ')'">A-101 (Office)</span></p>
        <p><strong>Due Date:</strong> <span th:text="${dueDate}">January 10, 2024</span></p>
        <p style="font-size: 20px; font-weight: bold; color: #4f46e5;">
            Total Due: ETB <span th:text="${#numbers.formatDecimal(amount, 0, 'COMMA', 2, 'POINT')}">15,000</span>
        </p>
    </div>
    <a href="#" th:href="${invoiceUrl}" style="display: inline-block; padding: 12px 24px; background: #4f46e5; color: white; text-decoration: none; border-radius: 6px;">
        View Invoice
    </a>
    <p style="margin-top: 20px; font-size: 14px; color: #6b7280;">
        💡 After making payment, upload your receipt through the portal.
    </p>
</div>
</body>
</html>
