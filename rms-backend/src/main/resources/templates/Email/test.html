<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Email</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f8fafc;
        }
        .header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px 8px 0 0;
        }
        .content {
            background: white;
            border: 1px solid #e5e7eb;
            padding: 30px;
            border-radius: 0 0 8px 8px;
            border-top: none;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #6b7280;
        }
        .success {
            color: #22c55e;
            font-size: 48px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="header">
    <h1 style="margin: 0;">🧪 Test Email</h1>
</div>
<div class="content">
    <div class="success">✅</div>
    <h2 style="text-align: center; color: #1f2937;">Email Configuration is Working!</h2>
    <p th:text="${message}" style="text-align: center; color: #4b5563; font-size: 16px;">
        This is a test email from RMS!
    </p>
    <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 20px 0;">
    <p style="font-size: 14px; color: #6b7280;">
        <strong>Sent at:</strong> <span th:text="${#dates.format(#dates.createNow(), 'yyyy-MM-dd HH:mm:ss')}">2026-08-11 10:00:00</span>
    </p>
    <p style="font-size: 14px; color: #6b7280;">
        <strong>From:</strong> RMS Rental Management System
    </p>
</div>
<div class="footer">
    © <span th:text="${year}">2026</span> RMS - Rental Management System
    <br>
    This is an automated test email.
</div>
</body>
</html>
